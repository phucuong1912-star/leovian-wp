# Pushes the whole Leovian site to InfinityFree over FTP on every push.
# InfinityFree has no SSH or git, so FTP is the only way in.
#
# Never uploaded or deleted on the host: wp-config.php, .htaccess, wp-content/uploads
# (they are not in git), plus the repo-only files listed under "exclude" below.
# Content (database) is edited directly in the live site's admin.
#
# The first run uploads every file (a few thousand, can take a while); after that
# only files changed since the last deploy are sent.
#
# Repository → Settings → Secrets and variables → Actions:
#   secrets   FTP_SERVER     ftpupload.net (see "FTP Details" in the InfinityFree client area)
#             FTP_USERNAME   if0_xxxxxxxx
#             FTP_PASSWORD   the hosting account (vPanel) password
#   variable  FTP_DIR        optional, default /htdocs/

name: Deploy site to InfinityFree

on:
  push:
    branches: [ main, master ]
    paths-ignore:
      - 'tools/**'
      - '**.md'
  workflow_dispatch:

# Never run two uploads at once; the second waits for the first.
concurrency:
  group: deploy-infinityfree
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: none

      - name: Check theme PHP syntax
        run: find wp-content/themes/leovian -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Upload site over FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: ${{ vars.FTP_DIR || '/htdocs/' }}
          timeout: 120000
          # Replaces the action's default list, so the git folders are repeated here.
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            tools/**
            wp-config.php
            .htaccess
            wp-content/uploads/**
