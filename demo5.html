<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="Leovian — Hệ sinh thái đầu tư & phát triển doanh nghiệp kết nối Úc và Việt Nam.">
    <meta name="theme-color" content="#0D0D0D">
    <title>Leovian — Investment & Business Development Ecosystem</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://images.unsplash.com">
    <link rel="preconnect" href="https://videos.pexels.com">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&display=swap" rel="stylesheet">
    <style>
        /* ================= Tokens =================
           Colours are unchanged from demo4. Playfair Display matches leovian.com.au;
           Be Vietnam Pro is drawn for Vietnamese diacritics. The diamond from the logo
           is the one recurring shape: hero window, CTA window, step markers, labels. */
        :root {
            --ink: #0D0D0D; --graphite: #171717; --deep: #090909;
            --gold: #C8A66A; --champagne: #E2C58E;
            --ivory: #F5F0E8; --t1: #DDD6CB; --t2: #BDB5AA; --t3: #8E867A;
            --ln: #3a3226; --ln2: #26211a;
            --serif: 'Playfair Display', Georgia, 'Times New Roman', serif;
            --sans: 'Be Vietnam Pro', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
            --wrap: 1320px; --gut: clamp(20px, 5vw, 72px); --hh: 84px;
            --ease: cubic-bezier(.22, .68, .16, 1); --io: cubic-bezier(.76, 0, .24, 1);
            color-scheme: dark
        }

        /* ================= Base ================= */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0 }
        html { scroll-behavior: smooth; -webkit-text-size-adjust: 100% }
        body { background: var(--ink); color: var(--ivory); font: 400 16px/1.7 var(--sans); font-variant-numeric: lining-nums; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; overflow-x: hidden }
        body.lock { overflow: hidden }
        body.instant *, body.instant *::before { transition: none !important }
        img, svg, video, iframe { display: block; max-width: 100% }
        a { color: inherit; text-decoration: none }
        button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer }
        ul, ol { list-style: none }
        [id] { scroll-margin-top: calc(var(--hh) + 16px) }
        :focus-visible { outline: 2px solid var(--champagne); outline-offset: 3px }
        #app:focus { outline: none }
        ::selection { background: var(--gold); color: var(--ink) }
        .skip { position: fixed; left: 12px; top: -60px; z-index: 120; background: var(--gold); color: var(--ink); padding: 12px 18px; font-size: 14px; transition: top .2s }
        .skip:focus { top: 12px }
        .ic { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none }
        .ic.sm { width: 16px; height: 16px }
        .ic.xs { width: 13px; height: 13px }
        #app, #ft { transition: opacity .28s ease }
        body.swap #app, body.swap #ft { opacity: 0 }

        /* ================= Type ================= */
        h1, h2, h3 { font-family: var(--serif); font-weight: 400; line-height: 1.1; letter-spacing: -.012em; color: var(--ivory); text-wrap: balance }
        h2 { font-size: clamp(2.2rem, 4.3vw, 3.9rem); line-height: 1.07 }
        h3 { font-size: clamp(1.35rem, 1.8vw, 1.7rem); line-height: 1.22 }
        .h-sm { font-size: clamp(1.75rem, 2.7vw, 2.5rem) }
        p { color: var(--t2); max-width: 62ch; text-wrap: pretty }
        .lead { font-size: clamp(1.05rem, 1.25vw, 1.18rem); font-weight: 300; line-height: 1.68; color: var(--t1) }
        .sub { font: italic 400 clamp(1.3rem, 1.9vw, 1.7rem)/1.3 var(--serif); color: var(--champagne); max-width: none }
        /* Second sentence of a two-sentence heading sits on its own, quieter line. */
        .cont { display: block; color: var(--t3) }
        .statement { max-width: 30em; font: 400 clamp(1.45rem, 2.45vw, 2.3rem)/1.4 var(--serif); color: var(--ivory) }
        .lbl { display: inline-flex; align-items: center; gap: 11px; font: 500 13.5px/1.4 var(--sans); letter-spacing: .01em; color: var(--champagne) }
        .lbl::before { content: ''; width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); flex: none }
        .en { display: block; margin-bottom: 6px; font: 500 12px/1.4 var(--sans); letter-spacing: .03em; color: var(--t3) }
        .hint { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--t3) }
        .hint .ic { color: var(--gold) }

        /* ================= Layout ================= */
        .wrap { max-width: calc(var(--wrap) + 2 * var(--gut)); margin: 0 auto; padding: 0 var(--gut) }
        .sec { position: relative; padding: clamp(88px, 10vw, 150px) 0 }
        .alt { background: var(--graphite) }
        .head { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 24px clamp(32px, 6vw, 110px); align-items: end; margin-bottom: clamp(48px, 6vw, 84px) }
        .head.solo { grid-template-columns: 1fr }
        .head .lbl { margin-bottom: 22px }
        .head h2 { max-width: 15em }
        .head > p { padding-bottom: 6px }
        .split { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: clamp(40px, 7vw, 120px); align-items: start }
        .sec-foot { display: flex; justify-content: flex-end; margin-top: 56px; padding-top: 32px; border-top: 1px solid var(--ln2) }

        /* ================= Buttons & links ================= */
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 12px; min-height: 52px; padding: 0 28px; border: 1px solid var(--gold); color: var(--champagne); font: 500 14.5px/1 var(--sans); letter-spacing: .01em; white-space: nowrap; transition: background-color .3s, color .3s, border-color .3s }
        .btn:hover { background: rgba(200, 166, 106, .12) }
        .btn.solid { background: var(--gold); color: var(--ink) }
        .btn.solid:hover { background: var(--champagne); border-color: var(--champagne) }
        .btn.sm { min-height: 42px; padding: 0 20px; font-size: 13.5px }
        .link { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font: 500 14.5px/1.3 var(--sans); color: var(--champagne); text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 7px; text-decoration-color: rgba(226, 197, 142, .38); transition: color .25s, text-decoration-color .25s }
        .link:hover { color: var(--ivory); text-decoration-color: var(--ivory) }
        .sqb { width: 52px; height: 52px; display: grid; place-items: center; border: 1px solid var(--ln); color: var(--champagne); transition: border-color .25s, background-color .25s, color .25s }
        .sqb:hover { border-color: var(--gold); background: var(--gold); color: var(--ink) }
        /* Icon inside a diamond outline, echoing the logo. */
        .icb { position: relative; width: 56px; height: 56px; display: grid; place-items: center; flex: none; color: var(--gold) }
        .icb::before { content: ''; position: absolute; inset: 9px; border: 1px solid var(--ln); transform: rotate(45deg) }
        .icb .ic { position: relative; width: 22px; height: 22px }

        /* ================= Floating ================= */
        #top { position: fixed; right: clamp(16px, 2.4vw, 28px); bottom: calc(clamp(16px, 2.4vw, 28px) + env(safe-area-inset-bottom, 0px)); z-index: 45; width: 52px; height: 52px; display: grid; place-items: center; color: var(--champagne); opacity: 0; visibility: hidden; transition: opacity .35s, visibility .35s }
        #top.show { opacity: 1; visibility: visible }
        #top .ring { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg) }
        #top .trk { fill: rgba(13, 13, 13, .8); stroke: var(--ln); stroke-width: 1.2 }
        #top .prg { fill: none; stroke: var(--gold); stroke-width: 1.5; stroke-dasharray: 145; stroke-dashoffset: calc(145 - 145 * var(--sp, 0)) }
        #top .ic { position: relative }
        /* Prototype-only toggle; sits above the back-to-top button so it never covers page content on the left. */
        .ntg { position: fixed; right: clamp(16px, 2.4vw, 28px); bottom: calc(clamp(16px, 2.4vw, 28px) + 62px + env(safe-area-inset-bottom, 0px)); z-index: 45; display: inline-flex; flex-direction: row-reverse; align-items: center; height: 42px; padding: 0 14px; background: rgba(23, 23, 23, .92); border: 1px solid var(--ln); color: var(--t2); font-size: 12.5px; transition: border-color .25s, color .25s }
        .ntg span { max-width: 0; overflow: hidden; white-space: nowrap; transition: max-width .4s var(--ease), margin .4s var(--ease) }
        .ntg:hover span, .ntg:focus-visible span { max-width: 200px; margin-right: 10px }
        .ntg[aria-pressed="true"] { border-color: var(--gold); color: var(--champagne) }
        [data-l]::after { display: none; content: attr(data-l); position: absolute; left: 12px; bottom: 12px; z-index: 6; padding: 4px 8px; background: rgba(13, 13, 13, .9); border: 1px dashed var(--gold); font: 500 10.5px/1.3 var(--sans); color: var(--champagne); text-align: left }
        .notes [data-l]::after { display: block }
        .hero-stage[data-l]::after, .band[data-l]::after { left: auto; right: 12px; bottom: auto; top: calc(var(--hh) + 14px) }
        .band[data-l]::after { top: 14px }

        /* ================= Header ================= */
        #hdr { position: fixed; inset: 0 0 auto; z-index: 60; padding-top: env(safe-area-inset-top, 0px); border-bottom: 1px solid transparent; transition: transform .6s var(--ease), background-color .4s, border-color .4s }
        #hdr.solid { background: rgba(13, 13, 13, .84); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-bottom-color: rgba(58, 50, 38, .55) }
        #hdr.hide { transform: translateY(-102%) }
        body.menu #hdr { background: transparent; border-bottom-color: transparent; -webkit-backdrop-filter: none; backdrop-filter: none; transform: none }
        .bar { height: var(--hh); display: flex; align-items: center; justify-content: space-between; gap: 28px }
        .brand { display: inline-flex; align-items: center; gap: 13px; color: var(--champagne) }
        .brand .mark { width: 32px; height: 32px; fill: none; stroke: currentColor; stroke-width: 1.3 }
        .brand span { font: 500 19px/1 var(--serif); letter-spacing: .3em; margin-right: -.3em }
        .nav { display: flex; align-items: center; gap: clamp(18px, 2.1vw, 34px) }
        .nav > a, .dd > a { position: relative; display: inline-flex; align-items: center; gap: 6px; padding: 12px 0; font: 400 14px/1 var(--sans); color: var(--t1); transition: color .25s }
        .nav > a::after, .dd > a::after { content: ''; position: absolute; left: 0; right: 0; bottom: 4px; height: 1px; background: var(--gold); transform: scaleX(0); transform-origin: left; transition: transform .45s var(--ease) }
        .nav > a:hover, .dd > a:hover, .nav [aria-current="page"] { color: var(--ivory) }
        .nav > a:hover::after, .dd > a:hover::after, .nav [aria-current="page"]::after { transform: scaleX(1) }
        .dd { position: relative }
        .dd > a .ic { transition: transform .3s }
        .dd:hover > a .ic, .dd:focus-within > a .ic { transform: rotate(180deg) }
        .mega { position: absolute; top: 100%; left: 50%; width: min(780px, 90vw); padding-top: 18px; opacity: 0; visibility: hidden; transform: translate(-50%, 8px); transition: opacity .3s, transform .4s var(--ease), visibility .3s }
        .dd:hover .mega, .dd:focus-within .mega { opacity: 1; visibility: visible; transform: translate(-50%, 0) }
        .mega-in { display: grid; grid-template-columns: 1.15fr 1fr 1fr; background: var(--graphite); border: 1px solid var(--ln); box-shadow: 0 30px 70px rgba(0, 0, 0, .55) }
        .mega-intro { position: relative; isolation: isolate; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start; gap: 10px; min-height: 260px; padding: 26px }
        .mega-intro img { position: absolute; inset: 0; z-index: -2; width: 100%; height: 100%; object-fit: cover }
        .mega-intro::before { content: ''; position: absolute; inset: 0; z-index: -1; background: linear-gradient(0deg, rgba(13, 13, 13, .96) 25%, rgba(13, 13, 13, .35)) }
        .mega-intro p { font: 400 1.3rem/1.25 var(--serif); color: var(--ivory) }
        .mega-col { padding: 26px 24px }
        .mega-col b { display: block; margin-bottom: 10px; font: 500 13px/1.4 var(--sans); color: var(--champagne) }
        .mega-col a { display: flex; align-items: center; gap: 12px; padding: 9px 0; font-size: 14px; line-height: 1.35; color: var(--t2); transition: color .2s }
        .mega-col a .ic { width: 18px; height: 18px; color: var(--gold) }
        .mega-col a:hover { color: var(--ivory) }
        .bar-r { display: flex; align-items: center; gap: 16px }
        .lang { display: flex; align-items: center; font: 500 12.5px/1 var(--sans); letter-spacing: .08em }
        .lang button { min-width: 38px; min-height: 40px; color: var(--t3); transition: color .2s }
        .lang button:hover, .lang button[aria-pressed="true"] { color: var(--champagne) }
        .lang i { width: 1px; height: 12px; background: var(--ln) }
        .burger { display: none; align-items: center; gap: 12px; height: 44px; padding: 0 4px 0 12px; font: 500 13.5px/1 var(--sans); color: var(--ivory) }
        .burger .bt-close, body.menu .burger .bt-open { display: none }
        body.menu .burger .bt-close { display: inline }
        .burger .bl { position: relative; width: 24px; height: 9px }
        .burger .bl i { position: absolute; left: 0; right: 0; height: 1px; background: currentColor; transition: transform .4s var(--ease), top .4s var(--ease) }
        .burger .bl i:first-child { top: 0 }
        .burger .bl i:last-child { top: 8px }
        body.menu .burger .bl i:first-child { top: 4px; transform: rotate(45deg) }
        body.menu .burger .bl i:last-child { top: 4px; transform: rotate(-45deg) }
        .ov { position: fixed; inset: 0; z-index: 55; background: var(--ink); opacity: 0; visibility: hidden; transition: opacity .4s var(--ease), visibility 0s .4s }
        body.menu .ov { opacity: 1; visibility: visible; transition: opacity .4s var(--ease), visibility 0s }
        .ov-in { height: 100%; display: grid; grid-template-rows: 1fr auto; padding: calc(var(--hh) + 20px) var(--gut) calc(28px + env(safe-area-inset-bottom, 0px)); overflow-y: auto }
        .ov-nav a { display: block; padding: 11px 0; border-bottom: 1px solid var(--ln2); font: 400 clamp(1.8rem, 6.4vw, 3.1rem)/1.15 var(--serif); color: var(--ivory); opacity: 0; transform: translateY(14px); transition: opacity .45s, transform .6s var(--ease), color .2s }
        body.menu .ov-nav a { opacity: 1; transform: none; transition-delay: calc(.06s + var(--i) * 40ms) }
        .ov-nav a[aria-current] { color: var(--champagne) }
        .ov-side { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px 24px; padding-top: 28px; font-size: 14px; color: var(--t2) }
        .ov-side a { display: flex; align-items: center; gap: 10px; min-height: 40px }
        .ov-side .ic { color: var(--gold) }

        /* ================= Hero: the diamond window =================
           The Melbourne / Ho Chi Minh City footage plays inside the logo's diamond.
           Scrolling opens the diamond until the footage fills the screen. */
        .hero { position: relative; background: var(--ink) }
        .hero.pin { height: calc(100svh + 90vh) }
        .hero-stage { position: relative; isolation: isolate; overflow: hidden; min-height: max(100svh, 600px); display: flex; flex-direction: column; justify-content: flex-end; padding-top: var(--top, 0px) }
        .hero.pin .hero-stage { position: sticky; top: 0; height: 100svh; min-height: 0 }
        .hero-win { position: absolute; inset: 0; z-index: -2; opacity: 0; clip-path: polygon(50% 50%, 50% 50%, 50% 50%, 50% 50%); transition: opacity 1.5s var(--ease) .5s }
        .hero.go .hero-win { opacity: 1 }
        .hero-media { position: absolute; inset: 0; transform: scale(calc(1.12 - var(--e, 0) * .12)) }
        .hero-media img, .hero-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.82) contrast(1.04) }
        .hero-dim { position: absolute; inset: 0; background: linear-gradient(0deg, rgba(13, 13, 13, .94) 0%, rgba(13, 13, 13, 0) 50%), linear-gradient(90deg, rgba(13, 13, 13, .72) 0%, rgba(13, 13, 13, .3) 58%, rgba(13, 13, 13, .38) 100%) }
        .hero-line { position: absolute; inset: 0; z-index: -1; width: 100%; height: 100%; overflow: visible; pointer-events: none }
        .hero-line polygon { fill: none; stroke: var(--gold); stroke-width: 1; stroke-dasharray: 1 1; stroke-dashoffset: 1; transition: stroke-dashoffset 2s var(--io) .1s }
        .hero.go .hero-line polygon { stroke-dashoffset: 0 }
        .hero-in { position: relative; width: 100%; padding-bottom: clamp(26px, 4vh, 44px) }
        /* Capped by width so the longest line ("Business Development", ~9.7em) never wraps mid-phrase. */
        .hero h1 { font-size: min(clamp(2.6rem, 7.3vw, 8.25rem), calc((100vw - 2 * var(--gut)) / 9.9)); line-height: 1.02; letter-spacing: -.022em; text-wrap: initial }
        .hero h1 em { font-style: italic; color: var(--champagne); padding: 0 .03em }
        .ln { display: block; overflow: hidden; padding: .2em .06em .12em; margin: -.2em -.06em -.12em }
        .ln > span { display: block; transform: translateY(115%); transition: transform 1.25s var(--ease); transition-delay: calc(.3s + var(--d) * .12s) }
        .hero.go .ln > span { transform: none }
        .hf { opacity: 0; transform: translateY(14px); transition: opacity 1s var(--ease), transform 1s var(--ease); transition-delay: calc(1.05s + var(--i, 0) * .1s) }
        .hero.go .hf { opacity: 1; transform: none }
        .hero-foot { display: grid; grid-template-columns: minmax(0, 5fr) auto minmax(0, 3fr); gap: 24px 56px; align-items: end; margin-top: clamp(26px, 4.5vh, 52px); padding-top: clamp(20px, 3vh, 30px); border-top: 1px solid rgba(200, 166, 106, .32) }
        .hero-foot .sub { margin-bottom: 10px }
        .hero-foot .lead { max-width: 50ch }
        .hero-clip { justify-self: end; display: flex; flex-direction: column; align-items: flex-end; gap: 12px }
        .hc-place { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; line-height: 1.2; color: var(--t1); white-space: nowrap }
        .hc-place .ic { color: var(--gold) }
        .hc-bars { display: flex; gap: 6px }
        .hc-bars b { position: relative; width: 56px; height: 2px; overflow: hidden; background: rgba(245, 240, 232, .18) }
        .hc-bars b i { position: absolute; inset: 0; background: var(--gold); transform: scaleX(var(--f, 0)); transform-origin: left; transition: transform .3s linear }

        /* ================= Media ================= */
        .mi { position: relative; overflow: hidden; background: var(--graphite) }
        .mi img { width: 100%; height: 100%; object-fit: cover; filter: saturate(.84) contrast(1.04); opacity: 0; transition: opacity .8s ease, transform 1.2s var(--ease) }
        .mi img.ld { opacity: 1 }
        .mi.portrait img { filter: grayscale(1) contrast(1.06) brightness(.95) }
        .vfx { opacity: 0; transition: opacity 1.4s ease }
        .vfx.on { opacity: 1 }
        a:hover .mi img.ld, .pcard:hover .mi img.ld { transform: scale(1.03) }

        /* ================= Home: intro ================= */
        .intro { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 7fr); gap: 32px clamp(40px, 7vw, 120px); align-items: start }
        .intro .lbl { margin-bottom: 22px }
        .intro h2 { font-size: clamp(1.9rem, 3.2vw, 3rem) }
        .intro-act { margin-top: 40px; padding-top: 26px; border-top: 1px solid var(--ln2) }

        /* ================= Home: purpose triptych, rising left to right ================= */
        .trip { --step: clamp(70px, 9vw, 140px); display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(16px, 2.2vw, 32px); align-items: start }
        .trip-h { height: calc(var(--step) * 2); max-width: 8em }
        .trip-i:nth-child(2) { margin-top: var(--step) }
        .trip-i .mi { aspect-ratio: 3/4 }
        .trip-i h3 { margin-top: 22px; font-size: clamp(1.45rem, 2.2vw, 2.1rem) }

        /* ================= Home: ecosystem index with preview ================= */
        .eco { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 8fr); gap: 32px clamp(40px, 6vw, 100px); padding: clamp(48px, 6vw, 80px) 0; border-top: 1px solid var(--ln) }
        .eco-side { position: sticky; top: calc(var(--hh) + 32px); align-self: start; display: flex; flex-direction: column; align-items: flex-start; gap: 14px }
        .eco-side h3 { font-size: clamp(1.9rem, 3vw, 2.8rem) }
        .eco-prev { position: relative; width: 100%; aspect-ratio: 4/5; margin-top: 18px; overflow: hidden; background: var(--graphite) }
        .eco-prev img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: saturate(.84); opacity: 0; transform: scale(1.04); transition: opacity .6s ease, transform 1.2s var(--ease) }
        .eco-prev img.on { opacity: 1; transform: none }
        .eco-row { display: grid; grid-template-columns: 40px minmax(0, 1fr) 20px; gap: 22px; align-items: start; padding: 30px 0; border-bottom: 1px solid var(--ln2) }
        .eco-list li:first-child .eco-row { padding-top: 6px }
        .eco-row > .ic:first-child { width: 26px; height: 26px; margin-top: 7px; color: var(--gold) }
        .eco-t { display: block; font: 400 clamp(1.55rem, 2.5vw, 2.3rem)/1.14 var(--serif); color: var(--ivory); transition: color .3s }
        .eco-d { display: block; margin-top: 10px; max-width: 56ch; font-size: 15px; line-height: 1.65; color: var(--t2) }
        .eco-go { margin-top: 12px; color: var(--t3); transition: color .3s, transform .4s var(--ease) }
        .eco-row.on .eco-t, .eco-row:hover .eco-t { color: var(--champagne) }
        .eco-row.on .eco-go, .eco-row:hover .eco-go { color: var(--champagne); transform: translateX(4px) }

        /* ================= Home: process (a real sequence, so it is numbered) ================= */
        .steps { position: relative; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0 clamp(20px, 3vw, 44px) }
        .steps::before { content: ''; position: absolute; left: 0; right: 0; top: 7px; height: 1px; background: linear-gradient(90deg, var(--gold), var(--ln) 85%) }
        .step { position: relative }

                <div class="mega-intro"><img src="${U('1602559227639-3bba8ce496df', 600)}" alt="" loading="lazy">${lb(t('Our Ecosystem', 'Hệ sinh thái'))}<p>${t('Connecting Resources. Expanding Opportunities.', 'Kết nối nguồn lực. Mở rộng cơ hội.')}</p>${lnk(t('Overview', 'Tổng quan'), 'ecosystem')}</div>
                ${PANES.map(p => `<div class="mega-col"><b>${tx(p.tag)}</b>${p.items.map((x, i) => `<a ${goAttr('ecosystem', p.pre + i)}>${ic(x.ic)}<span>${tx(x.t)}</span></a>`).join('')}</div>`).join('')}
            </div></div>`;
            // Menu order follows the content draft; Contact is the gold button at the end of the bar.
            const links = NAV.filter(n => n.k !== 'contact').map(n => n.k === 'ecosystem'
                ? `<div class="dd"><a ${goAttr('ecosystem')}${cur('ecosystem')}>${tx(n.t)}${ic('chev', 'xs')}</a>${mega}</div>`
                : `<a ${goAttr(n.k)}${cur(n.k)}>${tx(n.t)}</a>`).join('');
            const open = document.body.classList.contains('menu');
            $('#hdr').innerHTML = `<div class="wrap bar">
                <a class="brand" ${goAttr('home')} aria-label="Leovian — ${t('Home', 'Trang chủ')}">${LOGO}<span>LEOVIAN</span></a>
                <nav class="nav" aria-label="${t('Main', 'Điều hướng chính')}">${links}</nav>
                <div class="bar-r">${langSwitch()}<a class="btn sm solid bar-cta" ${goAttr('contact')}>${t('Contact', 'Liên hệ')}</a>
                    <button class="burger" aria-expanded="${open}" aria-controls="ov"><span class="bt-open">Menu</span><span class="bt-close">${t('Close', 'Đóng')}</span><span class="bl"><i></i><i></i></span></button></div>
            </div>`;
            $('#ov').innerHTML = `<div class="ov-in">
                <nav class="ov-nav" aria-label="${t('Main', 'Điều hướng chính')}">${NAV.map((n, i) => `<a ${goAttr(n.k)}${cur(n.k)} style="--i:${i}">${tx(n.t)}</a>`).join('')}</nav>
                <div class="ov-side"><div><a href="mailto:${OFFICE.mail}">${ic('mail', 'sm')}${OFFICE.mail}</a><a href="${OFFICE.telHref}">${ic('phone', 'sm')}${OFFICE.tel}</a></div>${langSwitch()}</div></div>`;
            $('#ov').inert = !open;
        }

        function footer() {
            $('#ft').innerHTML = `<div class="wrap ft-cta"><div>${lb(t('Contact', 'Liên hệ'))}<br><a class="ft-big" ${goAttr('contact')}>${t('Start a Conversation', 'Bắt đầu kết nối')}</a></div>
                    <div class="ft-mail"><a href="mailto:${OFFICE.mail}">${OFFICE.mail}</a><a href="${OFFICE.telHref}">${OFFICE.tel}</a></div></div>
                <div class="wrap ft-top">
                    <div class="ft-brand"><a class="brand" ${goAttr('home')}>${LOGO}<span>LEOVIAN</span></a>
                        <p class="sub">${t('Building Wealth. Empowering People.', 'Kiến tạo tài sản. Phát triển con người.')}</p>
                        <p>${t('An ecosystem connecting investment, businesses, technology, assets and people across Australia and Vietnam.', 'Hệ sinh thái kết nối đầu tư, doanh nghiệp, công nghệ, tài sản và con người tại Úc và Việt Nam.')}</p></div>
                    <div><h4>${t('Explore', 'Khám phá')}</h4><ul>${NAV.filter(n => n.k !== 'home').map(n => `<li><a ${goAttr(n.k)}>${tx(n.t)}</a></li>`).join('')}</ul></div>
                    <div><h4>${t('Ecosystem', 'Hệ sinh thái')}</h4><ul>${PANES.map(p => `<li><a ${goAttr('ecosystem', p.sec)}>${tx(p.tag)}</a></li>`).join('')}${INV.map((x, i) => `<li><a ${goAttr('ecosystem', 'i' + i)}>${tx(x.t)}</a></li>`).join('')}</ul></div>
                    <div><h4>${t('Office', 'Văn phòng')}</h4><ul class="ft-contact"><li>${ic('pin', 'sm')}<span>${OFFICE.addr}</span></li><li>${ic('globe', 'sm')}<a href="https://${OFFICE.web}" target="_blank" rel="noopener">${OFFICE.web}</a></li></ul></div>
                </div>
                <div class="wrap ft-bot"><span>© ${new Date().getFullYear()} Leovian. ${t('All rights reserved.', 'Bảo lưu mọi quyền.')}</span>
                    <span class="ft-note">${t('Design prototype — all content, people, events and contact details are placeholders pending Leovian approval. Stock photos and video: Unsplash, Pexels.', 'Bản thiết kế mẫu — mọi nội dung, nhân sự, sự kiện và thông tin liên hệ đều là minh họa, chờ Leovian xác nhận. Ảnh và video minh họa: Unsplash, Pexels.')}</span></div>`;
        }

        function chrome() {
            const notes = t('Design Notes', 'Ghi chú thiết kế');
            $('#ntg').innerHTML = `${ic('tag', 'sm')}<span>${notes}</span>`;
            $('#ntg').setAttribute('aria-label', notes);
            $('#top').innerHTML = $('#top').innerHTML.replace(/<svg class="ic[\s\S]*$/, '') + ic('up', 'sm');
            $('#top').setAttribute('aria-label', t('Back to top', 'Lên đầu trang'));
            $('.skip').textContent = t('Skip to content', 'Bỏ qua đến nội dung');
            document.title = `Leovian — ${page === 'home' ? t('Investment & Business Development Ecosystem', 'Hệ sinh thái Đầu tư & Phát triển Doanh nghiệp') : navLabel(page)}`;
        }

        /* ---------- Effects ---------- */
        // Photos fade in once loaded instead of popping in line by line.
        function imgFade() {
            $$('.mi img').forEach(img => {
                const ok = () => img.classList.add('ld');
                if (img.complete && img.naturalWidth) ok();
                else { img.addEventListener('load', ok, { once: true }); img.addEventListener('error', ok, { once: true }); }
            });
        }

        // Background videos only load and play while on screen.
        function bgVideos() {
            if (vio) vio.disconnect();
            const vids = $$('video[data-src]');
            if (!vids.length || !('IntersectionObserver' in window)) return;
            vio = new IntersectionObserver(entries => entries.forEach(x => {
                const v = x.target;
                if (!x.isIntersecting) { v.pause(); return; }
                if (!v.src) v.src = v.dataset.src;
                v.play().catch(() => { });
            }), { rootMargin: '200px 0px' });
            vids.forEach(v => { v.addEventListener('playing', () => v.classList.add('on'), { once: true }); vio.observe(v); });
        }

        // Hero cycles Melbourne and Ho Chi Minh City clips with a crossfade and a progress bar per clip.
        function heroVideo() {
            if (hio) hio.disconnect();
            const vids = $$('.hv');
            if (!vids.length || LITE) return;
            const bars = $$('.hc-bars b'), small = innerWidth < 900;
            let cur = 0;
            const show = i => {
                cur = i;
                vids.forEach((v, k) => v.classList.toggle('on', k === i));
                const loc = $('#hloc');
                if (loc) loc.textContent = tx(HERO.clips[i].place);
                bars.forEach((b, k) => { if (k !== i) b.style.setProperty('--f', 0); });
            };
            vids.forEach((v, i) => {
                v.src = PX(small ? HERO.clips[i].sd : HERO.clips[i].hd);
                v.addEventListener('timeupdate', () => { if (i === cur && v.duration) bars[i].style.setProperty('--f', (v.currentTime / v.duration).toFixed(3)); });
                v.addEventListener('ended', () => {
                    const n = (i + 1) % vids.length;
                    vids[n].currentTime = 0;
                    vids[n].play().then(() => show(n)).catch(() => { });
                });
            });
            vids[0].preload = 'auto';
            // Buffer only the next clip once the current one starts, not every clip at once.
            vids.forEach((v, i) => v.addEventListener('playing', () => { vids[(i + 1) % vids.length].preload = 'auto'; }, { once: true }));
            hio = new IntersectionObserver(([x]) => {
                if (x.isIntersecting) vids[cur].play().then(() => show(cur)).catch(() => { });
                else vids[cur].pause();
            });
            hio.observe($('.hero'));
        }

        // Measures the diamond window. The hero pins (and the diamond opens on scroll)
        // only when the headline block fits the screen beneath it.
        function heroGeo() {
            const el = $('.hero');
            HG.el = el;
            if (!el) return;
            const st = $('.hero-stage', el), inn = $('.hero-in', el);
            Object.assign(HG, { st, win: $('.hero-win', el), svg: $('.hero-line', el), poly: $('.hero-line polygon', el), p: -1 });
            // Width test uses innerWidth so it agrees with the 900px CSS breakpoint.
            const W = st.clientWidth, vh = innerHeight, wide = innerWidth > 900;
            HG.vw = innerWidth; HG.vh = vh;
            const hh = $('#hdr .bar') ? $('#hdr .bar').offsetHeight : 72;
            const r0 = wide ? Math.min(vh * .31, W * .24) : Math.min(W * .3, vh * .18);
            const cx = wide ? W * .62 : W * .5;
            const cy = wide ? Math.max(vh * .44, hh + 28 + r0) : hh + 24 + r0;
            const top = wide ? hh + 40 : Math.round(cy + r0 * .5);
            st.style.setProperty('--top', `${top}px`);
            HG.pin = !RM && inn.offsetHeight + top <= vh;
            el.classList.toggle('pin', HG.pin);
            const H = st.clientHeight;
            Object.assign(HG, { cx, cy, r0, rMax: Math.max(cx, W - cx) + Math.max(cy, H - cy) + 4, travel: Math.max(1, el.offsetHeight - H) });
            HG.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
        }

        function heroDraw() {
            if (!HG.el) return;
            const p = HG.pin ? clamp(-HG.el.getBoundingClientRect().top / HG.travel, 0, 1) : 0;
            if (p === HG.p) return;
            HG.p = p;
            const e = p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;
            const { cx, cy } = HG, r = HG.r0 + (HG.rMax - HG.r0) * e, g = r + 18;
            HG.win.style.clipPath = `polygon(${cx}px ${cy - r}px, ${cx + r}px ${cy}px, ${cx}px ${cy + r}px, ${cx - r}px ${cy}px)`;
            HG.poly.setAttribute('points', `${cx},${cy - g} ${cx + g},${cy} ${cx},${cy + g} ${cx - g},${cy}`);
            HG.svg.style.opacity = Math.max(0, 1 - e * 2.4).toFixed(3);
            HG.st.style.setProperty('--e', e.toFixed(3));
        }

        // Hovering or focusing an ecosystem row swaps the preview photo beside the list.
        function ecoInit() {
            $$('[data-eco]').forEach(g => {
                const rows = $$('.eco-row', g), imgs = $$('.eco-prev img', g);
                const act = i => {
                    rows.forEach((r, k) => r.classList.toggle('on', k === i));
                    imgs.forEach((m, k) => m.classList.toggle('on', k === i));
                };
                rows.forEach((r, i) => ['mouseenter', 'focus'].forEach(ev => r.addEventListener(ev, () => act(i))));
            });
        }

        function frame() {
            ticking = false;
            const y = scrollY, vh = innerHeight, max = document.documentElement.scrollHeight - vh;
            document.documentElement.style.setProperty('--sp', max > 0 ? (y / max).toFixed(4) : 0);
            const hdr = $('#hdr');
            // Over the home hero the bar stays clear until the footage has scrolled away.
            hdr.classList.toggle('solid', y > (HG.el ? HG.el.offsetHeight - vh * .6 : 40));
            if (Math.abs(y - lastY) > 6) {
                const down = y > lastY && y > 420;
                hdr.classList.toggle('hide', down && !document.body.classList.contains('menu') && !hdr.matches(':hover, :focus-within'));
                lastY = y;
            }
            $('#top').classList.toggle('show', y > 600);
            heroDraw();
        }

        function onScroll() {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(frame);
        }

        function teamGo(i) {
            teamIdx = (i + TEAM_N) % TEAM_N;
            $$('.slide').forEach((s, k) => { s.classList.toggle('on', k === teamIdx); s.inert = k !== teamIdx; });
            $$('.tthumb').forEach((b, k) => { b.classList.toggle('on', k === teamIdx); b.setAttribute('aria-pressed', k === teamIdx); });
            $('#tcount').innerHTML = `<b>${pad(teamIdx + 1)}</b> / ${pad(TEAM_N)}`;
        }

        // Jumps without the CSS smooth-scroll, used for page swaps.
        function jump(fn) {
            const r = document.documentElement;
            r.style.scrollBehavior = 'auto';
            fn();
            r.style.scrollBehavior = '';
        }

        function scrollToId(id, smooth) {
            const el = document.getElementById(id);
            if (!el) return false;
            const flash = el.hasAttribute('data-flash');
            el.scrollIntoView({ block: flash ? 'center' : 'start', behavior: smooth && !RM ? 'smooth' : 'auto' });
            if (flash) { el.classList.remove('flash'); void el.offsetWidth; el.classList.add('flash'); }
            return true;
        }

        function menu(open) {
            const o = open ?? !document.body.classList.contains('menu');
            document.body.classList.toggle('menu', o);
            document.body.classList.toggle('lock', o);
            const was = !$('#ov').inert;
            $('#ov').setAttribute('aria-hidden', !o);
            $('#ov').inert = !o;
            // Keep Tab inside the open menu, then hand focus back to the toggle.
            $('#app').inert = $('#ft').inert = o;
            const b = $('.burger');
            if (b) b.setAttribute('aria-expanded', o);
            if (o && !was) { const first = $('.ov-nav a'); if (first) first.focus({ preventScroll: true }); }
            else if (!o && was && b && $('#ov').contains(document.activeElement)) b.focus({ preventScroll: true });
        }

        function render(keep = false) {
            document.documentElement.lang = lang;
            $('#app').innerHTML = V[page]();
            header();
            footer();
            chrome();
            imgFade();
            bgVideos();
            heroVideo();
            ecoInit();
            if (page === 'about') teamGo(keep ? teamIdx : 0);
            heroGeo();
            const hero = $('.hero');
            if (hero && (keep || RM)) {
                // Language switch: show the hero as it was, without replaying the intro.
                document.body.classList.add('instant');
                hero.classList.add('go');
                requestAnimationFrame(() => requestAnimationFrame(() => document.body.classList.remove('instant')));
            } else if (hero) setTimeout(() => hero.classList.add('go'), 80);
            if (!keep) {
                jump(() => { if (!(target && scrollToId(target))) scrollTo(0, 0); });
                if (booted) $('#app').focus({ preventScroll: true });
            }
            target = null;
            booted = true;
            lastY = scrollY;
            frame();
        }

        function navigate(p, to) {
            page = p;
            target = to || null;
            try { history.pushState(null, '', '#' + p); } catch (e) { location.hash = p; return; }
            render();
        }

        // Page changes are a short fade so the destination arrives without a jump cut.
        function go(p, to) {
            menu(false);
            if ($('#dlg').open) $('#dlg').close();
            if (p === page && to && scrollToId(to, true)) return;
            if (p === page && !to) { scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' }); return; }
            if (RM) { navigate(p, to); return; }
            document.body.classList.add('swap');
            setTimeout(() => {
                navigate(p, to);
                requestAnimationFrame(() => document.body.classList.remove('swap'));
            }, 280);
        }

        function setLang(l) {
            if (l === lang) return;
            // The switch is rebuilt by render, so remember which copy had focus (header or menu).
            const inMenu = Boolean(document.activeElement && document.activeElement.closest('#ov'));
            lang = l;
            const y = scrollY;
            render(true);
            jump(() => scrollTo(0, y));
            const again = $(`${inMenu ? '#ov' : '#hdr'} [data-lang="${l}"]`);
            if (again) again.focus({ preventScroll: true });
        }

        function openEvent(i) {
            const e = EV[i], d = $('#dlg');
            d.innerHTML = `<div class="dlg-in"><div class="mi dlg-media" data-l="[EVENTS — EVENT COVER / GALLERY]"><img class="ld" src="${U(e.img, 1200)}" alt=""></div>
                <button class="dlg-x" data-close aria-label="${t('Close', 'Đóng')}">${ic('x')}</button>
                <div class="dlg-body">${lb(e.past ? t('Past event', 'Sự kiện đã diễn ra') : t('Upcoming event', 'Sự kiện sắp diễn ra'))}
                    <h3 id="dlg-title">${tx(e.t)}</h3>
                    <ul class="dlg-meta"><li>${ic('cal', 'sm')}${tx(e.date)}</li><li>${ic('pin', 'sm')}${tx(e.loc)}</li></ul>
                    <p>${tx(e.d)}</p>
                    <p class="hint">${ic('info', 'xs')}${t('Demonstration data — not a real Leovian event.', 'Dữ liệu minh họa — không phải sự kiện thật của Leovian.')}</p>
                    <div class="actions">${e.past ? '' : btn(t('Register Now', 'Đăng ký tham dự'), 'contact', 'solid')}<button class="btn" data-close>${t('Close', 'Đóng')}</button></div>
                </div></div>`;
            d.setAttribute('aria-labelledby', 'dlg-title');
            d.showModal();
        }

        /* ---------- Events ---------- */
        document.addEventListener('click', e => {
            const el = e.target.closest('[data-go],[data-lang],[data-team],[data-tm],[data-ev],[data-close],[data-skip],.burger,#top,#ntg');
            if (!el) return;
            // Let Ctrl/Cmd/Shift/middle-click open a page link in a new tab as usual.
            if (el.dataset.go && (e.metaKey || e.ctrlKey || e.shiftKey || e.button)) return;
            if (el.dataset.go) { e.preventDefault(); go(el.dataset.go, el.dataset.to); }
            else if (el.dataset.lang) setLang(el.dataset.lang);
            else if (el.dataset.team) teamGo(teamIdx + +el.dataset.team);
            else if (el.dataset.tm) teamGo(+el.dataset.tm);
            else if (el.dataset.ev) openEvent(+el.dataset.ev);
            else if ('close' in el.dataset) $('#dlg').close();
            else if ('skip' in el.dataset) { e.preventDefault(); $('#app').focus(); }
            else if (el.classList.contains('burger')) menu();
            else if (el.id === 'top') scrollTo({ top: 0, behavior: RM ? 'auto' : 'smooth' });
            else if (el.id === 'ntg') el.setAttribute('aria-pressed', document.body.classList.toggle('notes'));
        });

        document.addEventListener('submit', e => {
            e.preventDefault();
            e.target.insertAdjacentHTML('afterend', `<div class="ok" role="status" tabindex="-1"><span class="icb">${ic('check')}</span><div><h3>${t('Thank you.', 'Cảm ơn bạn.')}</h3><p>${t('This is a prototype confirmation; no data was sent.', 'Đây là xác nhận mô phỏng; không có dữ liệu nào được gửi.')}</p></div></div>`);
            const done = e.target.nextElementSibling;
            e.target.remove();
            done.focus();
        });

        $('#dlg').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') menu(false); });
        matchMedia('(min-width: 1181px)').addEventListener('change', e => { if (e.matches) menu(false); });
        addEventListener('scroll', onScroll, { passive: true });
        let rz;
        // A phone's URL bar showing or hiding only nudges the height; re-measuring then would make the diamond jump mid-scroll.
        addEventListener('resize', () => {
            clearTimeout(rz);
            rz = setTimeout(() => {
                if (innerWidth !== HG.vw || Math.abs(innerHeight - HG.vh) > 160) heroGeo();
                frame();
            }, 160);
        });
        addEventListener('hashchange', () => {
            const h = location.hash.slice(1) || 'home';
            if (!V[h] || h === page) return;
            page = h;
            render();
        });

        page = V[location.hash.slice(1)] ? location.hash.slice(1) : 'home';
        render();
        // Webfonts change the headline height, which decides whether the hero can pin.
        if (document.fonts) document.fonts.ready.then(() => { heroGeo(); frame(); });
    </script>
</body>
